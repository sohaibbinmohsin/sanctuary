    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #2F5D3A;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
      }
      .boot-screen {
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem;
        padding-top: calc(1.5rem + env(safe-area-inset-top, 0px));
        padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
        background: #2F5D3A;
        color: #E8EEE9;
        font-family: -apple-system, BlinkMacSystemFont, "DM Sans", "Segoe UI", Roboto, sans-serif;
        box-sizing: border-box;
      }
      .boot-screen__content {
        width: 100%;
        max-width: 28rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .boot-screen__brand-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin: 0;
      }
      .boot-screen__logo-wrap {
        position: relative;
        width: 6.5rem;
        height: 6.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-screen__spinner-ring {
        position: absolute;
        inset: -0.35rem;
        border-radius: 50%;
        border: 2.5px solid rgba(212, 229, 208, 0.18);
        border-top-color: #D4E5D0;
        border-right-color: rgba(212, 229, 208, 0.75);
        animation: boot-spin 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
      }
      @keyframes boot-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .boot-screen__logo {
        display: block;
        width: 5rem;
        height: 5rem;
      }
      .boot-screen__brand-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.25rem;
      }
      .boot-screen .brand {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 2.25rem;
        font-weight: 700;
        color: #E8EEE9;
        margin: 0;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .boot-screen .subheading {
        font-size: 0.875rem;
        font-weight: 500;
        color: #D4E5D0;
        margin: 0;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .boot-screen__footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: rgba(212, 229, 208, 0.85);
        letter-spacing: -0.01em;
      }
      .boot-screen__footer img {
        height: 1.15rem;
        width: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-busy="true" aria-live="polite">
        <div class="boot-screen__content">
          <div class="boot-screen__brand-lockup">
            <div class="boot-screen__logo-wrap">
              <div class="boot-screen__spinner-ring" aria-hidden="true"></div>
              <img
                class="boot-screen__logo"
                src="/sanctuary-mark.svg"
                alt=""
                width="80"
                height="80"
              />
            </div>
            <div class="boot-screen__brand-text">
              <h1 class="brand">Sanctuary</h1>
              <p class="subheading">Animal welfare platform</p>
            </div>
          </div>
        </div>
        <div class="boot-screen__footer">
          <span>Free software by The Mohsin Project</span>
          <img src="/mohsin-project-logo-white.svg" alt="" height="18" />
        </div>
      </main>
    </div>

        </p>
      </main>
